name: linux release

on:
  push:
    tags:
      - "linux-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example linux-v0.33.1"
        required: true
        type: string

concurrency:
  group: linux-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  UPSTREAM_BASE_TAG: "v0.41.1"
  UPSTREAM_BASE_COMMIT: "911345a87df1aa32c8617ce0445b0be8975abb49"
  SWIFTLINT_VERSION: "0.65.0"
  SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
  LINUX_SOURCEKIT_LIB_PATH: "/usr/lib/libsourcekitdInProc.so"
  ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"

jobs:
  release-linux:
    name: Build Linux x86_64 release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      aur_publish: ${{ steps.release.outputs.aur_publish }}
      version: ${{ steps.release.outputs.version }}
      package_version: ${{ steps.release.outputs.package_version }}
      commit: ${{ steps.release.outputs.commit }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    timeout-minutes: 45
    container: swift:6.3.2-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and verify release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^linux-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+linux\.[1-9][0-9]*)?$ ]]; then
            echo "invalid Linux release tag: $TAG" >&2
            exit 1
          fi

          git fetch --force origin \
            "+refs/heads/linux-port:refs/remotes/origin/linux-port" \
            "+refs/tags/$TAG:refs/tags/$TAG"
          COMMIT="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$COMMIT" origin/linux-port; then
            echo "$TAG does not point to a commit on origin/linux-port" >&2
            exit 1
          fi
          git tag --force "$UPSTREAM_BASE_TAG" "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_TAG" "$COMMIT"
          git checkout --detach "$COMMIT"

          VERSION="${TAG#linux-}"
          PACKAGE_VERSION="${VERSION#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "package_version=$PACKAGE_VERSION"
            echo "commit=$COMMIT"
            echo "source_date_epoch=$(git show -s --format=%ct "$COMMIT")"
            # Arch pkgver forbids prerelease hyphens; +linux.N revisions remain eligible.
            if [[ "$PACKAGE_VERSION" == *-* ]]; then
              echo "aur_publish=false"
            else
              echo "aur_publish=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libepoxy-dev pkg-config \
            librsvg2-dev librsvg2-common webp-pixbuf-loader libgirepository1.0-dev gobject-introspection \
            git curl jq ca-certificates xz-utils unzip zsh fish gcc file imagemagick ripgrep \
            rpm cpio desktop-file-utils patchelf ncurses-bin \
            at-spi2-core dbus-x11 gir1.2-atspi-2.0 openbox python3-gi xdotool xvfb xauth x11-xkb-utils ibus ibus-gtk4 \
            libatk-bridge2.0-0 libgl1-mesa-dri libegl-mesa0 mesa-utils
          curl -fsSLo /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum --check
          unzip -q /tmp/swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
          swift --version
          swiftlint --version
          curl -fsSLo /tmp/zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum --check
          tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          curl -fsSLo /tmp/zig17.tar.xz \
            https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  /tmp/zig17.tar.xz" | sha256sum --check
          tar -xJf /tmp/zig17.tar.xz -C /opt
          echo "GHOSTTY_ZIG=/opt/zig-x86_64-linux-0.17.0/zig" >> "$GITHUB_ENV"

      - name: Install Linux packaging tools
        run: |
          curl -fsSLo /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

          nfpm --version

      # The Swift container is root, but persistence failure tests intentionally depend on normal-user
      # POSIX write permissions. Run them at the same privilege level as the desktop application.
      - name: Test shared core as an unprivileged user
        working-directory: agtermCore
        run: |
          useradd --create-home --user-group agterm-test
          chown -R agterm-test:agterm-test "$GITHUB_WORKSPACE"
          runuser --user agterm-test -- env HOME=/home/agterm-test swift test --no-parallel

      - name: Reject Linux CLI parser drift
        run: scripts/check-linux-cli-drift.sh

      - name: Enforce host-free core boundary
        run: scripts/check-linux-core-boundary.sh "$UPSTREAM_BASE_TAG"

      - name: Reject whitespace errors
        run: |
          git diff --check
          git diff --check "$UPSTREAM_BASE_TAG"...HEAD

      - name: Test published-release verifier
        run: scripts/test-published-linux-release.sh

      - name: Test Linux architecture verification
        run: scripts/test-linux-architecture.sh

      - name: Resolve Linux architecture
        id: linux-architecture
        shell: bash
        run: |
          source linux/arch.sh
          echo "host=$HOST_ARCH" >> "$GITHUB_OUTPUT"

      - name: Lint Swift sources
        run: swiftlint lint --strict --quiet

      - name: Cache vendored Linux runtimes
        id: ghostty-cache
        uses: actions/cache@v6
        with:
          path: |
            agterm-linux/vendor/ghostty
            agterm-linux/vendor/zmx
          key: linux-runtimes-${{ steps.linux-architecture.outputs.host }}-${{ hashFiles('scripts/setup-linux.sh', 'scripts/verify-linux-vendor-cache.sh', 'scripts/verify-linux-zmx-cache.sh', 'scripts/verify-linux-architecture.sh', 'scripts/verify-linux-resources.sh', 'scripts/zmx-patches/**/*.patch', 'linux/arch.sh', 'linux/ghostty-resources.env', 'linux/ghostty-build.sh', 'scripts/ghostty-patches/**/*.patch', 'linux/zmx.env', 'linux/patches/*.patch') }}

      - name: Verify restored libghostty cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty

      - name: Verify restored zmx cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx

      - name: Test deterministic Ghostty resources
        run: scripts/test-linux-resources.sh

      - name: Build libghostty
        run: scripts/setup-linux.sh

      - name: Verify built libghostty cache
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty

      - name: Verify built zmx cache
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx

      - name: Test Linux package
        working-directory: agterm-linux
        run: swift test

      - name: Build Linux Debug products for GTK smoke
        working-directory: agterm-linux
        run: |
          swift build --product AgtermLinux
          swift build --product agtermctl-linux

      - name: GTK AT-SPI smoke tests
        env:
          AGTERM_UI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/linux-ui
        run: scripts/test-linux-ui.sh

      - name: Upload GTK diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-ui-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linux-ui
          if-no-files-found: warn

      - name: Build agterm-linux
        working-directory: agterm-linux
        run: swift build -c release

      - name: Package Linux release formats
        env:
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
        run: scripts/package-linux.sh "${{ steps.release.outputs.package_version }}" dist-linux

      - name: Verify Linux release formats
        run: scripts/verify-linux-packages.sh "${{ steps.release.outputs.package_version }}" dist-linux

      - name: Write release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          scripts/write-linux-release-notes.sh
          "${{ steps.release.outputs.tag }}"
          "${{ steps.release.outputs.commit }}"
          release-notes.md

      - name: Transfer verified packages and release notes
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-build
          path: |
            dist-linux/*
            release-notes.md
          if-no-files-found: error
          retention-days: 3

  publish-linux:
    name: Validate Arch and publish Linux release
    needs: release-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-linux.outputs.commit }}

      - uses: actions/download-artifact@v7
        with:
          name: linux-release-build
          path: .

      - name: Build, install, and exercise the Arch release package
        if: needs.release-linux.outputs.aur_publish == 'true'
        env:
          PACKAGE_VERSION: ${{ needs.release-linux.outputs.package_version }}
          SOURCE_DATE_EPOCH: ${{ needs.release-linux.outputs.source_date_epoch }}
        run: scripts/test-aur-package.sh "$PACKAGE_VERSION" dist-linux

      - name: Upload Arch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-arch-diagnostics
          path: artifacts/aur
          if-no-files-found: warn

      - name: Check final release checksums
        working-directory: dist-linux
        env:
          PACKAGE_VERSION: ${{ needs.release-linux.outputs.package_version }}
        run: sha256sum --check --strict "agterm-linux-v${PACKAGE_VERSION}-SHA256SUMS"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: dist-linux/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-linux.outputs.tag }}
          target_commitish: ${{ needs.release-linux.outputs.commit }}
          files: dist-linux/*
          fail_on_unmatched_files: true
          name: agterm-linux ${{ needs.release-linux.outputs.version }}
          body_path: release-notes.md
          make_latest: true

      - name: Verify public release assets and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-linux.outputs.tag }}
          ARCH_PACKAGE: ${{ needs.release-linux.outputs.aur_publish }}
        run: |
          args=("$RELEASE_TAG")
          if [[ "$ARCH_PACKAGE" == true ]]; then args+=(--require-arch); fi
          scripts/verify-published-linux-release.sh "${args[@]}"

  publish-aur:
    needs: [release-linux, publish-linux]
    if: needs.release-linux.outputs.aur_publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ needs.release-linux.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
