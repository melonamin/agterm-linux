name: publish AUR package

on:
  workflow_call:
    inputs:
      tag:
        description: Published Linux release tag
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(inputs.tag, 'linux-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate AUR release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/aur_release.py validate-tag "$TAG" "$GITHUB_OUTPUT"

      - name: Download release checksum
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "agterm-linux-${TAG#linux-}-SHA256SUMS" \
            --dir /tmp/agterm-release
          grep "agterm-linux-${TAG#linux-}-x86_64.tar.gz$" \
            "/tmp/agterm-release/agterm-linux-${TAG#linux-}-SHA256SUMS" \
            | awk '{print $1}' > /tmp/agterm-tarball.sha256

      - name: Update package metadata
        if: steps.tag.outputs.publish == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          TARBALL_SHA256="$(cat /tmp/agterm-tarball.sha256)"
          LICENSE_SHA256="$(sha256sum LICENSE | awk '{print $1}')"
          python3 scripts/aur_release.py update-pkgbuild \
            packaging/aur/PKGBUILD "$TAG" "$TARBALL_SHA256" "$LICENSE_SHA256"

      - name: Regenerate .SRCINFO
        if: steps.tag.outputs.publish == 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE/packaging/aur:/pkg" \
            archlinux:base-devel \
            bash -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'

      - name: Publish package to AUR
        if: steps.tag.outputs.publish == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ inputs.tag }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          AUR_HOST_KEY="$(ssh-keyscan -t ed25519 aur.archlinux.org 2>/dev/null)"
          test "$(printf '%s\n' "$AUR_HOST_KEY" | ssh-keygen -lf - | awk '{print $2}')" = \
            'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          printf '%s\n' "$AUR_HOST_KEY" >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/agterm-linux-bin.git /tmp/aur
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "agterm-linux release bot"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
              echo "AUR package is already up to date"
              exit 0
          fi
          git commit -m "Update to ${VERSION#linux-v}"
          git push
