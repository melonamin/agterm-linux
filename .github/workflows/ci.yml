name: build

on:
  push:
    branches: [linux-port]
  pull_request:
    branches: [linux-port]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_BASE_TAG: "v0.26.1"
  UPSTREAM_BASE_COMMIT: "c215430d1cb56bfca4e062274947cde6d237c18d"
  SWIFTLINT_VERSION: "0.65.0"
  SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
  LINUX_SOURCEKIT_LIB_PATH: "/usr/lib/libsourcekitdInProc.so"
  ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      cookbook: ${{ steps.filter.outputs.cookbook }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            swift:
              - "**/*.swift"
              - "agtermCore/**"
              - "agterm/**"
              - "agterm-linux/**"
              # The agent skill and its plugin manifests are test inputs.
              - "plugins/**"
              - ".claude-plugin/**"
              - ".agents/**"
              - "linux/**"
              - "packaging/linux/**"
              - "project.yml"
              - "scripts/**"
              - ".swiftlint.yml"
              - "agtermTests/.swiftlint.yml"
              - "agtermUITests/.swiftlint.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/release-linux.yml"
            cookbook:
              - "cookbook/**"
              - ".github/workflows/ci.yml"

  test-linux:
    name: Unit tests (Linux)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-24.04
    # Keep the shared, host-free controller package green on Linux because it backs the GTK frontend.
    container: swift:6.3.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install test shell
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep zsh
      - name: Materialize and verify upstream boundary tag
        run: |
          git tag --force "$UPSTREAM_BASE_TAG" "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_TAG" HEAD
      # Two persistence tests deliberately verify write failures through POSIX directory permissions.
      # The official Swift container runs as root, which bypasses those permissions, so exercise the
      # package as an ordinary desktop user like the application itself.
      - name: swift test as an unprivileged user
        working-directory: agtermCore
        run: |
          useradd --create-home --user-group agterm-test
          chown -R agterm-test:agterm-test "$GITHUB_WORKSPACE"
          runuser --user agterm-test -- env HOME=/home/agterm-test swift test
      - name: Enforce host-free core boundary
        run: scripts/check-linux-core-boundary.sh "$UPSTREAM_BASE_TAG"
      - name: Reject Linux CLI parser drift
        run: scripts/check-linux-cli-drift.sh

  lint-linux:
    name: SwiftLint (Linux)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install SwiftLint
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip
          curl -fsSLo /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum --check
          unzip -q /tmp/swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
          swiftlint --version
      - name: swiftlint (strict)
        run: swiftlint lint --strict --quiet
      - name: Materialize and verify upstream boundary tag
        run: |
          git tag --force "$UPSTREAM_BASE_TAG" "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_TAG" HEAD
      - name: Reject whitespace errors
        run: |
          git diff --check
          git diff --check "$UPSTREAM_BASE_TAG"...HEAD

      - name: Test published-release verifier
        run: scripts/test-published-linux-release.sh

  build-linux:
    name: Build app (Linux GTK)
    needs: [changes, test-linux, lint-linux]
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-24.04
    # Compile-check the GTK port. The official Swift image carries the toolchain; apt adds GTK4,
    # libadwaita, GL deps, and zig builds libghostty.
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install GTK4, accessibility, software GL, test shells, and zig
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libepoxy-dev pkg-config git curl ca-certificates xz-utils ncurses-bin \
            ripgrep zsh file at-spi2-core dbus-x11 gir1.2-atspi-2.0 openbox python3-gi xdotool xvfb xauth \
            libatk-bridge2.0-0 libgl1-mesa-dri libegl-mesa0 mesa-utils
          curl -fsSLo /tmp/zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum --check
          tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Materialize and verify upstream boundary tag
        run: |
          git tag --force "$UPSTREAM_BASE_TAG" "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_TAG" HEAD
      - name: Enforce host-free core boundary and CLI sharing
        run: |
          scripts/check-linux-core-boundary.sh "$UPSTREAM_BASE_TAG"
          scripts/check-linux-cli-drift.sh
      - name: Test Linux architecture verification
        run: scripts/test-linux-architecture.sh
      - name: Resolve Linux architecture
        id: linux-architecture
        shell: bash
        run: |
          source linux/arch.sh
          echo "host=$HOST_ARCH" >> "$GITHUB_OUTPUT"
      - name: Cache vendored Linux runtimes
        id: ghostty-cache
        uses: actions/cache@v6
        with:
          path: |
            agterm-linux/vendor/ghostty
            agterm-linux/vendor/zmx
          key: linux-runtimes-${{ steps.linux-architecture.outputs.host }}-${{ hashFiles('scripts/setup-linux.sh', 'scripts/verify-linux-vendor-cache.sh', 'scripts/verify-linux-zmx-cache.sh', 'scripts/verify-linux-architecture.sh', 'scripts/verify-linux-resources.sh', 'linux/arch.sh', 'linux/ghostty-resources.env', 'linux/zmx.env', 'linux/patches/ghostty-embedded-opengl.patch', 'linux/patches/ghostty-embedded-input-handoff.patch', 'linux/patches/ghostty-lib-resources.patch') }}
      - name: Verify restored libghostty cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty
      - name: Verify restored zmx cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx
      - name: Test deterministic Ghostty resources
        run: scripts/test-linux-resources.sh
      - name: Build libghostty (skips if the cache restored it)
        run: scripts/setup-linux.sh
      - name: Verify built libghostty cache
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty
      - name: Verify built zmx cache
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx
      - name: swift test (agterm-linux)
        working-directory: agterm-linux
        run: swift test
      - name: swift build (agterm-linux)
        working-directory: agterm-linux
        run: swift build
      - name: swift build Release/WMO (agterm-linux)
        working-directory: agterm-linux
        run: swift build -c release
      - name: Validate staged Linux payload
        run: scripts/stage-linux.sh "$RUNNER_TEMP/agterm-stage"
      - name: GTK AT-SPI smoke tests
        env:
          AGTERM_UI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/linux-ui
        run: scripts/test-linux-ui.sh
      - name: Upload GTK diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-ui-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linux-ui
          if-no-files-found: warn

  cookbook:
    name: Cookbook checks
    needs: changes
    if: needs.changes.outputs.cookbook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: recipe layout, index and headings
        # bash explicitly: the block below uses process substitution, and pipefail
        # is what makes a failed find in a command substitution red the step
        shell: bash
        run: |
          fail=0

          # directory set vs index set, BOTH directions
          dirs=$(find cookbook -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          # links come ONLY from canonical table rows, so a link in prose, an html
          # comment or a fenced example cannot satisfy the check
          links=$(grep -E '^\|' cookbook/README.md 2>/dev/null \
                  | grep -oE '\]\([a-z0-9][a-z0-9-]*/\)' \
                  | sed -e 's/^](//' -e 's|/)$||' | sort -u || true)
          missing=$(comm -23 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          stale=$(comm -13 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          for n in $missing; do echo "::error::$n is missing from the index"; fail=1; done
          for n in $stale;   do echo "::error::index row '$n' points at no such directory"; fail=1; done

          for d in cookbook/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if printf '%s' "$name" | grep -qE '[^a-z0-9-]|--|^-|-$'; then
              echo "::error::$name is not kebab-case"; fail=1
            fi
            if [ ! -f "$d/README.md" ]; then
              echo "::error::$name has no README.md"; fail=1; continue
            fi
            for h in "## What it does" "## Requirements" "## Setup" \
                     "## Usage" "## How it works" "## Limits"; do
              if ! grep -qxF "$h" "$d/README.md"; then
                echo "::error::$name README is missing the '$h' heading"; fail=1
              fi
            done
          done

          # every script carries a shebang
          while IFS= read -r -d '' f; do
            if ! head -c 2 "$f" | grep -q '#!'; then
              echo "::error::$f has no shebang"; fail=1
            fi
          done < <(find cookbook -type f \( -name '*.sh' -o -name '*.zsh' -o -name '*.fish' -o -name '*.py' \) -print0)

          exit $fail
      - name: shellcheck
        # bash explicitly, for pipefail: xargs -0 -r exits 0 on empty input, so
        # without it a failed find would leave the step green having checked nothing
        shell: bash
        run: find cookbook -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Install recipe shells
        # neither is on the ubuntu-latest image; fish runs a recipe regression test
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: zsh syntax check
        # shellcheck cannot parse zsh, so a parse is the only gate .zsh recipes get.
        # -n1 because zsh -n reads one script and treats the rest as its arguments;
        # bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        run: find cookbook -type f -name '*.zsh' -print0 | xargs -0 -r -n1 zsh -n
      - name: fish syntax check
        # nothing lints .fish either, so a parse is the only gate these recipes get.
        # -n1 because fish --no-execute parses its first argument and ignores the rest,
        # so a batched call would leave the step green having checked one file
        shell: bash
        run: find cookbook -type f -name '*.fish' -print0 | xargs -0 -r -n1 fish --no-execute
      - name: Install ruff
        # not on the ubuntu-latest image, unlike shellcheck. pipx, because the runner's
        # python is externally managed and a bare pip install into it fails
        run: pipx install ruff
      - name: ruff
        # the .py counterpart of shellcheck, so a recipe is linted rather than only parsed.
        # EXE001 is ignored because it fails a shebang on a non-executable file, which
        # collides head-on with the shebang the layout step requires of every script, and
        # would move executable-bit policy into CI where this repo deliberately keeps it
        # out. bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        run: find cookbook -type f -name '*.py' -print0 | xargs -0 -r ruff check --ignore EXE001
      - name: Python recipe tests
        # one process per file keeps recipes independent and gives each test script its own argv.
        # bash explicitly, for pipefail, same reason as the ruff step above.
        shell: bash
        run: find cookbook -type f -name 'test_*.py' -print0 | xargs -0 -r -n1 python3
